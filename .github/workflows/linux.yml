name: Linux desktop

on:
  push:
    branches: [main, linux, codex/linux-port]
    paths:
      - 'linux/**'
      - 'core/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'linux/**'
      - 'core/**'
      - '.github/workflows/linux.yml'

jobs:
  amd64-shell:
    name: Qt shell and Swift bridge — amd64
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Confirm Ubuntu 24.04 package baseline
        run: grep -q '^VERSION_ID="24.04"$' /etc/os-release
      - name: Install Qt, SQLite and X11 build tools
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev cmake ninja-build g++ file \
            python3-pil \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript \
            qt6-qpa-plugins
      - name: Run the core suite
        run: swift test --package-path core -j 2
      - name: Build Swift bridge
        run: swift build --package-path linux/app/bridge -j 2
      - name: Exercise core-backed day actions and record isolation
        run: |
          bridge=$(swift build --show-bin-path --package-path linux/app/bridge)/ChotkiLinuxBridge
          python3 linux/app/bridge/tests/check_bridge.py "$bridge"
      - name: Build Qt shell
        run: |
          cmake -S linux/app/ui -B linux/app/ui/build -G Ninja
          cmake --build linux/app/ui/build -j 2
      - name: Exercise sidebar, prayer rope, reading, library, home actions, progress, glossary, settings, and helper restart
        run: |
          bridge=$(swift build --show-bin-path --package-path linux/app/bridge)/ChotkiLinuxBridge
          CHOTKI_LINUX_BRIDGE="$bridge" ctest --test-dir linux/app/ui/build --output-on-failure
      - name: Check bridge and bundled core on amd64
        run: |
          bridge=$(swift build --show-bin-path --package-path linux/app/bridge)/ChotkiLinuxBridge
          printf '{"v":1,"id":1,"op":"hello"}\n{"v":1,"id":2,"op":"snapshot"}\n' | "$bridge" --review > /tmp/chotki-bridge.jsonl
          grep -q '"mode":"review"' /tmp/chotki-bridge.jsonl
          grep -q '"psalmOneVerses":6' /tmp/chotki-bridge.jsonl
          file "$bridge" linux/app/ui/build/chotki-linux
      - name: Load the Qt window without a display server
        run: |
          bridge=$(swift build --show-bin-path --package-path linux/app/bridge)/ChotkiLinuxBridge
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8s linux/app/ui/build/chotki-linux --review "$bridge" > /tmp/chotki-ui.log 2>&1
          result=$?
          set -e
          cat /tmp/chotki-ui.log
          test "$result" -eq 124
          grep -q 'tray unavailable' /tmp/chotki-ui.log
      - name: Build release binaries and alpha package
        run: |
          swift build --package-path linux/app/bridge -c release -j 2
          cmake -S linux/app/ui -B linux/app/ui/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/app/ui/release -j 2
          bridge=$(swift build --show-bin-path --package-path linux/app/bridge -c release)/ChotkiLinuxBridge
          file linux/app/ui/release/chotki-linux "$bridge" | tee /tmp/chotki-release-file.txt
          grep -q 'x86-64' /tmp/chotki-release-file.txt
          ldd linux/app/ui/release/chotki-linux "$bridge" | tee /tmp/chotki-release-ldd.txt
          if grep -q 'not found' /tmp/chotki-release-ldd.txt; then
            echo "A release binary has an unresolved library" >&2
            exit 1
          fi
          linux/tools/package-deb.sh linux/app/ui/release/chotki-linux "$bridge" linux/dist
          dpkg-deb --contents linux/dist/*.deb > /tmp/chotki-package-contents.txt
          dpkg-deb --info linux/dist/*.deb | tee /tmp/chotki-package-info.txt
          grep -q 'usr/share/doc/chotki/Qt-LGPL-NOTICE.txt' /tmp/chotki-package-contents.txt
          grep -q 'usr/share/doc/chotki/LGPL-3.txt' /tmp/chotki-package-contents.txt
          grep -q 'usr/share/doc/chotki/RUNTIME.txt' /tmp/chotki-package-contents.txt
          grep -q 'usr/share/doc/chotki/Swift-LICENSE.txt' /tmp/chotki-package-contents.txt
          grep -q 'usr/share/doc/chotki/XCharter-LICENSE.txt' /tmp/chotki-package-contents.txt
          grep -q 'usr/share/applications/org.chotki.Chotki.desktop' /tmp/chotki-package-contents.txt
          grep -q 'org.chotki.Chotki.png' /tmp/chotki-package-contents.txt
          grep -q 'progress.jpg' /tmp/chotki-package-contents.txt
          grep -q 'kjv.json' /tmp/chotki-package-contents.txt
          grep -q 'psalter.json' /tmp/chotki-package-contents.txt
          grep -q 'calendar/manifest.json' /tmp/chotki-package-contents.txt
          grep -q 'Version: 1.0~beta' /tmp/chotki-package-info.txt
          grep -q sqlite /tmp/chotki-package-info.txt
          if grep -q '/home/' /tmp/chotki-package-contents.txt; then
            echo "package contains a home path" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chotki-linux-amd64-alpha
          path: linux/dist/*.deb
          if-no-files-found: error

  amd64-deb-install:
    name: Install alpha .deb on Ubuntu 24.04 — amd64
    needs: amd64-shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: chotki-linux-amd64-alpha
          path: linux-dist
      - name: Install without development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ./linux-dist/*.deb
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' chotki
          file /usr/lib/chotki/chotki-linux /usr/lib/chotki/ChotkiLinuxBridge | tee /tmp/chotki-installed-file.txt
          grep -q 'x86-64' /tmp/chotki-installed-file.txt
          test "$(dpkg-query -W -f='${Architecture}' chotki)" = amd64
          LD_LIBRARY_PATH=/usr/lib/chotki/swift \
            ldd /usr/lib/chotki/chotki-linux /usr/lib/chotki/ChotkiLinuxBridge \
            | tee /tmp/chotki-installed-ldd.txt
          if grep -q 'not found' /tmp/chotki-installed-ldd.txt; then
            echo "The installed package has an unresolved library" >&2
            exit 1
          fi
      - name: Render installed review screen headlessly
        run: |
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "installed review failed: $status"; cat /tmp/chotki-installed.log 2>/dev/null || true; fi' EXIT
          test -d /usr/lib/chotki/ChotkiCore_ChotkiCore.bundle
          test -f /usr/share/chotki/Resources/sayings/order.txt
          test -f /usr/share/chotki/Resources/progress.jpg
          test -f /usr/share/chotki/Resources/sayings/281.jpg
          printf '{"v":1,"id":1,"op":"snapshot"}\n' | \
            LD_LIBRARY_PATH=/usr/lib/chotki/swift \
            /usr/lib/chotki/ChotkiLinuxBridge --review > /tmp/chotki-installed-bridge.jsonl
          grep -q '"psalmOneVerses":6' /tmp/chotki-installed-bridge.jsonl
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            chotki --review --screenshot /tmp/chotki-installed.png > /tmp/chotki-installed.log 2>&1
          cat /tmp/chotki-installed.log
          file /tmp/chotki-installed.png | grep -q 'PNG image data, 1100 x 860'
          test "$(stat -c%s /tmp/chotki-installed.png)" -gt 100000
          test -f "$HOME/.cache/chotki-linux-review/chotki.sqlite"
          test -f /usr/share/doc/chotki/Qt-LGPL-NOTICE.txt
          test -f /usr/share/doc/chotki/LGPL-3.txt
          test -f /usr/share/doc/chotki/RUNTIME.txt
          test -f /usr/share/applications/org.chotki.Chotki.desktop
          dpkg-query -W -f='${Depends}\n' chotki | tr ',' '\n' | awk '{print $1}' \
            | grep -Ex 'g\+\+|gcc|cmake|swift|build-essential' && exit 1 || true
      - name: Keep the record across reinstall, upgrade, and removal
        run: |
          set -eu
          data=$(mktemp -d)
          restored=$(mktemp -d)
          CHOTKI_EXPECT_VERSION="1.0 beta" \
            python3 linux/tools/installed-flow.py \
            /usr/lib/chotki/ChotkiLinuxBridge "$data" "$restored"
          db="$data/Chotki/chotki.sqlite"
          sum=$(sha256sum "$db")
          sudo apt-get install -y --reinstall ./linux-dist/*.deb
          test "$(sha256sum "$db")" = "$sum"
          stage=$(mktemp -d)
          dpkg-deb -R ./linux-dist/*.deb "$stage"
          sed -i 's/^Version: .*/Version: 1.0~beta2/' "$stage/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$stage" /tmp/chotki-upgrade.deb
          sudo dpkg -i /tmp/chotki-upgrade.deb
          test "$(dpkg-query -W -f='${Version}' chotki)" = "1.0~beta2"
          test "$(sha256sum "$db")" = "$sum"
          sudo apt-get remove -y chotki
          test ! -e /usr/lib/chotki
          test ! -e /usr/bin/chotki
          test ! -e /usr/share/applications/org.chotki.Chotki.desktop
          test ! -e /usr/share/doc/chotki
          test "$(sha256sum "$db")" = "$sum"
